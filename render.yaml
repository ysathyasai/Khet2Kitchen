services:
  - type: web
    name: khet2kitchen
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn k2k.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: k2k-mysql
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
