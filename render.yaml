services:
  - type: web
    name: khet2kitchen
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn k2k.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false
      - key: SARVAM_API_BASE_URL
        value: "https://api.sarvam.ai"
      - key: GEMINI_MODEL_NAME
        value: "gemini-3.6-flash"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "yejjusatyasai2007@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Khet2Kitchen <yejjusatyasai2007@gmail.com>"


